# 点棒いらず — iOS 無人ビルド（Codemagic / Mac不要）
# 前提（Codemagic UI 側で1回だけ設定）:
#   1. App Store Connect API キーを連携（Integrations → Developer Portal）
#      → 名前を "CodemagicApiKey" にして下の integrations と一致させる
#   2. Bundle ID `com.cetacompany.tenboirazu` は登録済み（App Store Connect / Identifiers）
# 署名: 手動フロー（fetch-signing-files に証明書秘密鍵 CERTIFICATE_PRIVATE_KEY を渡す）。
# 新規アカウントは配布証明書が0枚のため、自動署名(ios_signing)は "No matching profiles found" で
# 失敗する。秘密鍵を渡すと --create が「証明書・Bundle ID・プロファイル」を新規作成できる。
# 【Codemagic UI で1回だけ設定】: 環境変数グループ "signing" を作り、CERTIFICATE_PRIVATE_KEY に
#   CETA-secrets/ios-signing/certificate_private_key.pem の全文を Secure で登録すること。
workflows:
  ios-release:
    name: 点棒いらず iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: CodemagicApiKey   # ← Codemagic UI で作成したAPIキー名に置換
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    environment:
      # 証明書秘密鍵 CERTIFICATE_PRIVATE_KEY を含むグループ（Codemagic UI で作成）
      groups:
        - signing
      vars:
        BUNDLE_ID: "com.cetacompany.tenboirazu"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      # xcode は latest を維持（Apple の SDK 要件更新に自動追従するため）。
      # メジャー更新でビルドが壊れた場合は一時的に "16.2" のように固定して切り分けること。
      xcode: latest
      cocoapods: default
    scripts:
      - name: npm 依存をインストール（lockfile による決定的ビルド）
        script: npm ci
      - name: Web資産を www/ に生成
        script: npm run build:web
      - name: iOSプラットフォームを追加（無ければ）＋同期
        script: |
          if [ ! -d "ios" ]; then npx cap add ios; fi
          npx cap sync ios
      - name: アイコン/スプラッシュを生成（assets/ から全サイズ）
        script: |
          npx @capacitor/assets generate --ios \
            --iconBackgroundColor '#1c7622' \
            --splashBackgroundColor '#eef1ee' \
            --splashBackgroundColorDark '#06160c'
        # 入力: assets/icon.png(1024)・assets/splash.png / splash-dark.png(2732) … 準備済み
        # @capacitor/assets は devDependencies（npm ci で導入済み）
      - name: 輸出コンプライアンス回答を焼き込み
        script: |
          # ios/ は毎ビルド雛形から再生成されるため、ここで毎回パッチする
          # デバイスは Capacitor 既定の iPhone + iPad 両対応（13インチiPadスクショは appstore/screenshots/13/ に用意済み）
          # 通信ゼロ・独自暗号なしのため false。未設定だと毎回 Missing Compliance で配信が止まる
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist
      - name: バージョン/ビルド番号を設定（2本目以降のTestFlight拒否を防止）
        script: |
          MARKETING_VERSION=$(node -p "require('./package.json').version")
          cd ios/App
          agvtool new-marketing-version "$MARKETING_VERSION"
          agvtool new-version -all "$BUILD_NUMBER"   # Codemagic のビルド連番を CFBundleVersion に採用
      - name: CocoaPods
        script: |
          cd ios/App && pod install
      - name: 署名アセットを作成/取得（証明書秘密鍵を渡す）
        script: |
          set -e
          keychain initialize
          # CERTIFICATE_PRIVATE_KEY を渡すことで、配布証明書が1枚も無くても
          # --create が「証明書・Bundle ID・プロファイル」を新規作成しディスクへ保存する
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
          # ios/ は毎ビルド再生成される（Capacitor既定は Automatic 署名）ため、毎回 Manual に上書き
          xcode-project use-profiles --project "ios/App/App.xcodeproj"
          # 取得できているか可視化（0件ならアーカイブが失敗するので早期に気付ける）
          echo "=== 取得済みプロビジョニングプロファイル ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || true
          ls -la "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/" 2>/dev/null || true
      - name: ビルド（.ipa 生成）
        script: |
          # -destination 'generic/platform=iOS' で archive の宛先を固定（mac_mini_m2 の既知事象を回避）
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true   # 最初は TestFlight へ。審査提出は手動 or true に変更
        # submit_to_app_store: false
