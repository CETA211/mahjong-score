<svg xmlns="http://www.w3.org/2000/svg" width="2732" height="2732" viewBox="0 0 2732 2732">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f2f6f2"/>
      <stop offset="1" stop-color="#dfe8df"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bccabc"/>
      <stop offset="1" stop-color="#93a693"/>
    </linearGradient>
    <linearGradient id="redChar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d62b30"/>
      <stop offset="1" stop-color="#a8141b"/>
    </linearGradient>
  </defs>

  <!-- 背景: グリーンテーマの淡いグレー緑 -->
  <rect width="2732" height="2732" fill="#eef1ee"/>
  <rect width="2732" height="2732" fill="url(#glow)"/>

  <!-- 署名的: 画面を囲む緑フレーム（中央クロップされても四辺が残るよう内側に） -->
  <rect x="820" y="620" width="1092" height="1492" rx="72" fill="none" stroke="#0f8043" stroke-opacity="0.55" stroke-width="10"/>

  <!-- 中央の牌（中央クロップ安全圏内） -->
  <g transform="translate(1366,1230)">
    <rect x="-210" y="-272" width="420" height="572" rx="58" fill="url(#side)"/>
    <rect x="-210" y="-292" width="420" height="566" rx="56" fill="url(#tile)" stroke="#c3d2c3" stroke-width="3"/>
    <rect x="-178" y="-260" width="356" height="502" rx="38" fill="none" stroke="#cfe0cf" stroke-width="3" opacity="0.9"/>
    <text x="0" y="-8" text-anchor="middle" dominant-baseline="central"
          font-family="'Yu Mincho','YuMincho','MS Mincho','Hiragino Mincho ProN',serif"
          font-size="420" font-weight="900" fill="url(#redChar)"
          stroke="#7e0d12" stroke-width="4" paint-order="stroke">中</text>
  </g>

  <!-- タイトル（緑枠の内側に収まる幅: 5文字×140 + 字間36×4 = 844px < 枠内幅1092px） -->
  <text x="1366" y="1720" text-anchor="middle"
        font-family="'Yu Mincho','YuMincho','MS Mincho','Hiragino Mincho ProN',serif"
        font-size="140" font-weight="700" fill="#1c7622" letter-spacing="36">点棒いらず</text>
</svg>
